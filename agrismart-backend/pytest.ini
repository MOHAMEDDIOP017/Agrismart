[pytest]
testpaths = tests

# pytest-asyncio est déjà dans requirements.txt mais n'était pas configuré :
# les tests `async def` étaient silencieusement ignorés (PytestUnhandledCoroutine
# Warning). En mode `auto`, ils sont exécutés sans avoir à décorer chaque test.
# Nécessaire pour tester les services asynchrones (recommandation, agent).
asyncio_mode = auto
