name: agritech
description: "KoobalaTech - Application mobile d'assistance agricole intelligente pour l'Afrique subsaharienne"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # Gestion d'état
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Animations
  lottie: ^3.0.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.2.10
  cloud_firestore: ^5.4.4

  # Réseau & Cache
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.0

  # Stockage local
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # UI Components
  flutter_svg: ^2.0.9
  gap: ^3.0.1
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1

  # Médias
  image_picker: ^1.0.7

  # Localisation GPS
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Utilitaires
  intl: ^0.19.0
  logger: ^2.3.0
  equatable: ^2.0.5

  # --- Module Détection (Module 2) ---
  # Caméra
  camera: ^0.10.5+9

  # Traitement image
  image: ^4.1.7

  # Stockage temporaire
  path_provider: ^2.1.2
  path: ^1.9.0

  # Permissions
  permission_handler: ^11.3.1

  # Partage
  share_plus: ^12.0.2

  # --- Module Expert (Module 3) ---
  # Graphiques (rapports, statistiques)
  fl_chart: ^0.67.0

  # Carte interactive (supervision champs)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Export PDF
  pdf: ^3.10.8
  printing: ^5.13.1

  # Recherche avec suggestions (maladies, produits)
  flutter_typeahead: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
