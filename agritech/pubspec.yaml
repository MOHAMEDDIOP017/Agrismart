name: agritech
description: "AgriSmart - Application mobile d'assistance agricole intelligente pour l'Afrique subsaharienne"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # Gestion d'état
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Animations
  shimmer: ^3.0.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.2.10
  cloud_firestore: ^5.4.4

  # Réseau & Cache
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.0

  # Stockage local
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # UI Components
  flutter_svg: ^2.0.9
  gap: ^3.0.1

  # Médias
  image_picker: ^1.0.7

  # Localisation GPS
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Utilitaires
  intl: ^0.19.0
  logger: ^2.3.0
  equatable: ^2.0.5

  # --- Module Détection (Module 2) ---
  # Caméra
  camera: ^0.10.5+9

  # Traitement image
  image: ^4.1.7

  # Stockage temporaire
  path_provider: ^2.1.2
  path: ^1.9.0

  # Permissions
  permission_handler: ^11.3.1

  # Partage
  share_plus: ^12.0.2

  # --- Module Expert (Module 3) ---
  # Graphiques (rapports, statistiques)
  fl_chart: ^0.67.0

  # Carte interactive (supervision champs)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Export PDF
  pdf: ^3.10.8
  printing: ^5.13.1

  # Recherche avec suggestions (maladies, produits)
  flutter_typeahead: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Nunito, embarquee plutot que telechargee.
  #
  # google_fonts allait chercher la fonte sur le reseau au premier lancement.
  # Hors couverture, ce premier lancement echoue et toute l'application
  # s'affiche dans la police systeme, ce qui contredit la contrainte de
  # connexion irreguliere. La dependance a ete retiree.
  #
  # Quatre instances statiques plutot qu'un seul fichier variable. Sur une
  # fonte variable, seul fontVariations pilote l'axe de graisse : un
  # TextStyle(fontWeight: bold) reste au trace par defaut, et un
  # copyWith(fontWeight:) ne produit rien. La mesure l'a confirme, deux
  # graisses opposees rendaient exactement la meme largeur. Le code compte 258
  # usages de fontWeight : des instances statiques declarees une par graisse
  # restituent le comportement attendu partout.
  #
  # Chaque instance est reduite aux caracteres utiles, francais, wolof,
  # chiffres et ponctuation, soit 38 % de la fonte complete. Les quatre
  # ensemble pesent 203 Ko, moins que les 270 Ko du fichier variable.
  #
  # Licence SIL Open Font License 1.1, texte complet dans assets/fonts/OFL.txt.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
